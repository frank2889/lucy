name: Lucy Compute Worker

on:
  workflow_dispatch:
    inputs:
      lucy_url:
        description: 'Coordinator URL (e.g., https://lucy.world)'
        required: true
        type: string
      lucy_token:
        description: 'API token for coordinator'
        required: true
        type: string
      concept:
        description: 'Concept to train on (e.g., "consciousness")'
        required: false
        type: string
        default: 'patterns'
      train_ticks:
        description: 'Number of training ticks (default 3000)'
        required: false
        type: string
        default: '3000'

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'crates/lucy-worker'

      - name: Build lucy-worker
        run: cargo build --release -p lucy-worker 2>&1 | tail -20

      - name: Run training worker
        run: |
          ./target/release/lucy-worker \
            --coordinator "${{ inputs.lucy_url }}" \
            --token "${{ inputs.lucy_token }}" \
            --ticks "${{ inputs.train_ticks }}" \
            --concept "${{ inputs.concept }}"
        continue-on-error: true
        timeout-minutes: 290

      - name: Post results
        if: always()
        run: |
          echo "Worker run completed for concept: ${{ inputs.concept }}"
          echo "Ticks trained: ${{ inputs.train_ticks }}"
