services:
  lucy:
    build: .
    container_name: lucy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - lucy-data:/lucy/data
      - lucy-modules:/lucy/modules
    environment:
      - RUST_LOG=info
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  lucy-data:
  lucy-modules:
