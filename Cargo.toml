[workspace]
resolver = "2"
members = [
    "crates/lucy-core",
    "crates/lucy-io",
    "crates/lucy-state",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
smallvec = { version = "1", features = ["serde"] }
rand = "0.8"
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
serde_json = "1"
